<div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; align-items: baseline; gap: 14px; padding-bottom: 18px; border-bottom: 2px solid #141518"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: clamp(22px, 2.2vw, 26px); color: #7A6000; font-variant-numeric: tabular-nums">01</span><h2 id="sec-problem" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(22px, 2.2vw, 26px); color: #141518">The problem</h2></div>
<p style="margin: 0; max-width: 860px; font-size: 19px; line-height: 1.6">Our team took care of 15 systems for a single client, 8 of them in active development, each with its own team. In this case study, each system and its team is called a project, and each project gets its own library. Every project built its own presentations, and the client kept complaining about the same thing: each designer was working on their own to fix their individual model.</p><div style="display: flex; flex-direction: column; gap: 16px"><p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5F66">As-is workflow</p><ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px"><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #141518; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">1</span><span style="display: flex; flex-direction: column; gap: 4px; flex: 1"><span style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Designer</strong></span><span style="color: #5C5F66">Starts a presentation from their own file, or from a copy of an old deck.</span></span></li><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #141518; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">2</span><span style="display: flex; flex-direction: column; gap: 4px; flex: 1"><span style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Designer</strong></span><span style="color: #5C5F66">Fixes layouts, styles and slide types by hand, system by system.</span></span></li><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #141518; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">3</span><span style="display: flex; flex-direction: column; gap: 4px; flex: 1"><span style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Client</strong></span><span style="color: #5C5F66">Receives presentations with a lack of consistency across the 8 systems.</span></span></li></ol><p style="margin: 8px 0 0; font-size: 19px; line-height: 1.5">Which caused these pain points:</p><ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px"><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span style="display: flex; flex-direction: column; gap: 6px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Duplicated effort</strong><span>The same slides were rebuilt over and over, in every project and every deliverable.</span></span></li><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span style="display: flex; flex-direction: column; gap: 6px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">No shared model</strong><span>Without a common base, every deck reached the client in a different shape.</span></span></li></ul></div><div style="display: flex; flex-direction: column; gap: 16px"><p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5F66">Requirements</p><p style="margin: 0; font-size: 19px; line-height: 1.5">To fix it, the new tool needed to cover these three things:</p><ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 16px"><li style="background: #141518; color: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #F2C230">01 · Setup</span><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 1.25">Customize once</strong><span style="color: #B9BBBF">Each designer sets up their project a single time, then reuses it.</span></li><li style="background: #2E3036; color: #FFFFFF; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #F2C230">02 · Coverage</span><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 1.25">Discovery to delivery</strong><span style="color: #C9CBCF">Slide types for every stage of the product, not only the final pitch.</span></li><li style="background: #F2C230; color: #141518; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 15px; color: #141518">03 · Scale</span><strong style="font-family: 'Space Grotesk', sans-serif; font-size: 22px; line-height: 1.25">One library, 8 projects</strong><span style="color: #2E3036">A shared Sketch Library that every project team can pull from.</span></li></ol></div>
</div>
</section>
<section aria-labelledby="sec-approach" style="background: #FFFFFF; border-bottom: 1px solid #E0E0DE">
<div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">
<div style="display: flex; align-items: baseline; gap: 14px; padding-bottom: 18px; border-bottom: 2px solid #141518"><span style="font-family: 'Space Grotesk', sans-serif; font-weight: 500; font-size: clamp(22px, 2.2vw, 26px); color: #7A6000; font-variant-numeric: tabular-nums">02</span><h2 id="sec-approach" style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: clamp(22px, 2.2vw, 26px); color: #141518">Approach and details</h2></div>
<div style="background: #E9E9E7; color: #141518; border-radius: 24px; padding: clamp(28px, 4vw, 48px); display: flex; flex-direction: column; gap: 28px"><div style="display: flex; flex-direction: column; gap: 12px; max-width: 760px"><p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #7A6000">Approach</p><h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: clamp(22px, 2.2vw, 28px); font-weight: 700; line-height: 1.2">Build a Sketch Library with every component the teams needed</h3></div><div class="thd {{thCls}}" style="{{thVars}}; display: flex; flex-direction: column; gap: 20px"><p style="margin: 0; color: #5C5F66; font-size: 15px">Customize once: pick a palette and every slide follows.</p><div style="position: relative; border-radius: 20px; background: #141518; padding: clamp(40px, 6vw, 72px) clamp(20px, 4vw, 48px); overflow: hidden"><div style="position: relative; z-index: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: clamp(14px, 2vw, 24px); align-items: center"><div style="transform: rotate(-2deg)"><div aria-hidden="true" class="vD" style="position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 1px rgba(255,255,255,.14), 0 12px 28px rgba(0,0,0,.35)"><span aria-hidden="true" class="" style="position: absolute; left: 8%; top: 30%; width: 52%; height: 9%; border-radius: 99px; background: #FFFFFF"></span><span aria-hidden="true" class="vA" style="position: absolute; left: 8%; top: 45%; width: 34%; height: 5%; border-radius: 99px"></span><span aria-hidden="true" class="vA" style="position: absolute; left: 70%; top: 0%; width: 30%; height: 100%; border-radius: 0"></span><span aria-hidden="true" class="vP" style="position: absolute; left: 76%; top: 58%; width: 18%; height: 30%; border-radius: 50%"></span><span aria-hidden="true" class="" style="position: absolute; left: 8%; top: 78%; width: 16%; idth: 8%; height: 14%; border-radius: 50%"></span><span aria-hidden="true" class="" style="position: absolute; left: 68%; top: 60%; width: 18%; height: 5%; border-radius: 99px; background: #B9BBBF"></span><span aria-hidden="true" class="" style="position: absolute; left: 68%; top: 70%; width: 13%; height: 5%; border-radius: 99px; background: #D3D4D6"></span></div></div></div><div style="position: absolute; inset: 0; z-index: 2; pointer-events: none"><div aria-hidden="true" style="position: absolute; left: 4%; bottom: 7%"><span class="vA" style="display: inline-flex; align-items: center; height: 34px; padding: 0 18px; border-radius: 99px; box-shadow: 0 8px 18px rgba(0,0,0,.14)"><span style="width: 64px; height: 7px; border-radius: 99px; background: rgba(0,0,0,.55)"></span></span></div><div aria-hidden="true" style="position: absolute; right: 5%; top: 8%"><span class="vP" style="display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 14px; border-radius: 8px; box-shadow: 0 8px 18px rgba(0,0,0,.14)"><span class="vB" style="width: 10px; height: 10px; border-radius: 50%"></span><span style="width: 44px; height: 6px; border-radius: 99px; background: rgba(255,255,255,.75)"></span></span></div><div aria-hidden="true" style="position: absolute; right: 6%; bottom: 9%; width: 22%"><span style="display: block; background: #FFFFFF; border-radius: 12px; padding: 12px 14px; box-shadow: 0 8px 18px rgba(0,0,0,.14)"><span style="display: block; width: 55%; height: 6px; border-radius: 99px; background: #B9BBBF; margin-bottom: 10px"></span><span class="vS" style="display: block; height: 8px; border-radius: 99px; overflow: hidden"><span class="vA" style="display: block; width: 64%; height: 100%"></span></span></span></div><div aria-hidden="true" style="position: absolute; left: 30%; top: 4%"><span class="vD" style="display: flex; width: 44px; height: 44px; border-radius: 12px; align-items: center; justify-content: center; box-shadow: 0 0 0 1px rgba(255,255,255,.16), 0 8px 18px rgba(0,0,0,.3)"><span class="vB" style="width: 16px; height: 16px; border-radius: 50%"></span></span></div></div></div><div role="group" aria-label="Palette" style="display: flex; gap: 10px; flex-wrap: wrap; align-items: center"><button type="button" class="thc0" aria-pressed="{{pr0}}" onClick="{{pick0}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #D3D4D6; border-radius: 99px; background: {{cb0}}; color: {{cf0}}; font: inherit; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(90deg, #2E3036 50%, #F2C230 50%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.9), 0 0 0 2.5px rgba(0,0,0,.08)"></span><span>System A</span></button><button type="button" class="thc1" aria-pressed="{{pr1}}" onClick="{{pick1}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #D3D4D6; border-radius: 99px; background: {{cb1}}; color: {{cf1}}; font: inherit; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(90deg, #14213D 50%, #E63946 50%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.9), 0 0 0 2.5px rgba(0,0,0,.08)"></span><span>System B</span></button><button type="button" class="thc2" aria-pressed="{{pr2}}" onClick="{{pick2}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #D3D4D6; border-radius: 99px; background: {{cb2}}; color: {{cf2}}; font: inherit; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(90deg, #4CBB17 50%, #9B30FF 50%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.9), 0 0 0 2.5px rgba(0,0,0,.08)"></span><span>System C</span></button><button type="button" class="thc3" aria-pressed="{{pr3}}" onClick="{{pick3}}" style="display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 14px; border: 1px solid #D3D4D6; border-radius: 99px; background: {{cb3}}; color: {{cf3}}; font: inherit; font-weight: 600; cursor: pointer"><span aria-hidden="true" style="width: 16px; height: 16px; border-radius: 50%; background: linear-gradient(90deg, #F77F00 50%, #FFD23F 50%); box-shadow: 0 0 0 1.5px rgba(255,255,255,.9), 0 0 0 2.5px rgba(0,0,0,.08)"></span><span>System D</span></button><span style="flex: 1"></span><button type="button" onClick="{{toggle}}" aria-label="{{playLabel}}" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border: none; border-radius: 99px; background: #141518; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer"><span aria-hidden="true">{{playIcon}}</span><span>{{playText}}</span></button></div></div><p style="margin: 0; max-width: 820px; font-size: 19px; line-height: 1.6; color: #1B1C1F">I took over the backlog for this tool, triaged it, and built a Sketch file to be used as a Library, Sketch’s name for a reusable component set. Its content came from two sources: a benchmark of every presentation in the account, and the client’s complaints list.</p></div><div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); gap: 40px"><div style="display: flex; flex-direction: column; gap: 12px"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; box-sizing: border-box; background: #2E3036; box-shadow: inset 0 0 0 10px #F2C230"></span><h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #141518">Goal</h3><p style="margin: 0">Decks that support each system’s documentation, such as the UI source of truth, user stories or onboarding. It depends on what each system documents, and the belt can be customized for any of it.</p></div><div style="display: flex; flex-direction: column; gap: 12px"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; box-sizing: border-box; background: #F2C230"></span><h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #141518">Constraints</h3><p style="margin: 0">8 active systems with their own teams and habits, one client, Sketch as the shared tool, and Sketch files that get heavy fast.</p></div><div style="display: flex; flex-direction: column; gap: 12px"><span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 50%; box-sizing: border-box; background: #141518"></span><h3 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; color: #141518">Outcome</h3><p style="margin: 0">The Utility Belt: a Sketch presentation library that designers customize once and use at every stage of the product, from discovery to delivery.</p></div></div>

<section aria-labelledby="sec-process" style="background: #F3F3F2; border-bottom: 1px solid #E0E0DE">
<div style="max-width: 1240px; margin: 0 auto; padding: 88px 24px; box-sizing: border-box; display: flex; flex-direction: column; gap: 36px">

<p style="margin: 0; max-width: 860px; font-size: 19px; line-height: 1.6">The Utility Belt replaced individual models with one shared library: set up once per project, and used for every deliverable.</p><div style="display: flex; gap: 16px; align-items: flex-start; max-width: 860px; padding: 22px 24px; border-radius: 16px; background: #EEF7F1; border: 1.5px solid #1E8E4F"><span aria-hidden="true" style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #1E8E4F; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><p style="margin: 0; font-size: 19px; line-height: 1.55; color: #1B1C1F"><strong style="font-weight: 600">Adopted by all 8 systems.</strong> Rolling the Utility Belt out became one of my OKRs, and we implemented it in every system in the account.</p></div><div style="display: flex; flex-direction: column; gap: 16px"><p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5C5F66">To-be workflow</p><ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); gap: 12px"><li style="background: #EEF7F1; border: 1.5px solid #1E8E4F; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span style="flex: none; width: 32px; height: 32px; border-radius: 50%; background: #141518; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 14px">1</span><span style="display: flex; flex-direction: column; gap: 4px; flex: 1"><span style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Designer</stron ex; align-items: center; flex-wrap: wrap; gap: 8px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Client</strong><span style="padding: 1px 6px; border-radius: 4px; background: #1E8E4F; color: #FFFFFF; font-family: Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; line-height: 1.5">Changed</span></span><span style="color: #1B1C1F">Receives <strong style="color: #1E8E4F; font-weight: 600">consistent presentations</strong> across the 8 systems.</span></span></li></ol><p style="margin: 8px 0 0; font-size: 19px; line-height: 1.5">Which solved…</p><ul style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 380px), 1fr)); gap: 12px"><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #1E8E4F; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span style="display: flex; flex-direction: column; gap: 6px"><strong style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; color: #141518">Less duplicated effort</strong><span>Slides are built once in the library instead of again in every project.</span></span></li><li style="background: #FFFFFF; border: 1px solid #E0E0DE; border-radius: 16px; padding: 22px; display: flex; gap: 14px; align-items: flex-start"><span aria-hidden="true" style="flex: none; width: 28px; height: 28px; border-radius: 50%; background: #1E8E4F; display: flex; align-items: center; justify-content: center"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3L13 4.5" strok   lkMount() {
    let k = null;
    try { k = sessionStorage.getItem('tai-lk'); } catch (e) {}
    if (k) { this.lkOpenWith(this.lkB(k)).catch(() => { try { sessionStorage.removeItem('tai-lk'); } catch (e) {} }); }
  }
  async lkOpenWith(raw) {
    const D = this.lkData();
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const c = this.lkB(D.c);
    const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: c.slice(0, 12) }, key, c.slice(12));
    this.setState({ lk: JSON.parse(new TextDecoder().decode(pt)), lkErr: '', lkBusy: false });
  }
  async lkTry(pw) {
    const D = this.lkData();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode((pw || '').trim().toLowerCase()), 'PBKDF2', false, ['deriveKey']);
    for (const e of D.k) {
      try {
        const kek = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: this.lkB(e.s), iterations: D.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);

        await this.lkOpenWith(raw);
        try { let s = ''; raw.forEach((b) => { s += String.fromCharCode(b); }); sessionStorage.setItem('tai-lk', btoa(s)); } catch (er) {}
        return true;
      } catch (er) {}
    }
    return false;
  }

    const TH = [{"p10": "#F3EEEA", "p30": "#D9CEC4", "p35": "#C9BCB1", "p40": "#A8968A", "p60": "#6E5A4E", "p70": "#4A382E", "p80": "#3B2B22", "p90": "#231812", "a30": "#FFF1B0", "a40": "#FADC5A", "a60": "#F4C049", "a80": "#DAA535"}, {"p10": "#F0F1F1", "p30": "#C4C5C7", "p35": "#B0B0B3", "p40": "#96989A", "p60": "#626468", "p70": "#47494E", "p80": "#2E3036", "p90": "#1E1F23", "a30": "#FAEAB7", "a40": "#F6D46E", "a60": "#F2C230", "a80": "#CEA529"}, {"p10": "#EFEFF1", "p30": "#BDC1C9", "p35": "#A6ABB5", "p40": "#8A909E", "p60": "#4F586E", "p70": "#303C54", "p80": "#14213D", "p90": "#0D1528", "a30": "#F6BABE", "a40": "#EE747E", "a60": "#E63946", "a80": "#C4303C"}, {"p10": "#EFF3F0", "p30": "#BFCDC4", "p35": "#A8BBB0", "p40": "#8DA696", "p60": "#547A62", "p70": "#366247", "p80": "#1B4D2E", "p90": "#12321E", "a30": "#DCB7FF", "a40": "#B96EFF", "a60": "#B464FF", "a80": "#8429D9"}, {"p10": "#EFF3F1", "p30": "#C0CDC9", "p35": "#AABCB5", "p40": "#8FA69E", "p60": "#577A6E", "p70": "#3A6354", "p80": "#1F4E3D", "p90": "#143328", "a30": "#FCD2A6", "a40": "#F9A54C", "a60": "#F77F00", "a80": "#D26C00"}];
    const k = this.state.shwK ?? 0;
    vals.shwVars = Object.entries(TH[k]).map(([r, c]) => '--' + r + ': ' + c).join('; ');
    TH.forEach((t, i) => {
      const on = i === k;
      vals['shwPick' + i] = () => this.setState({ shwK: i });
      vals['shwPr' + i] = on ? 'true' : 'false';
      vals['shwBg' + i] = on ? '#141518' : 'transparent';
      vals['shwFg' + i] = on ? '#FFFFFF' : '#141518';
    });
    }


    {
    const lk = this.state.lk;
    vals.lk = lk || {};
    vals.lkOpen = !!lk;
    vals.lkShut = !lk;
    vals.lkErr = this.state.lkErr || '';
    vals.lkHasErr = !!this.state.lkErr;
    vals.lkBtn = this.state.lkBusy ? 'Unlocking…' : 'Unlock';
    vals.lkInput = (e) => { this.lkPw = e.target.value; if (this.state.lkErr) this.setState({ lkErr: '' }); };
    vals.lkSubmit = (e) => {
      if (e && e.preventDefault) e.preventDefault();
      if (this.state.lkBusy) return;
      this.setState({ lkBusy: true, lkErr: '' });
      this.lkTry(this.lkPw).then((ok) => { if (!ok) this.setState({ lkBusy: false, lkErr: 'Hmm, not that one. Try again, or hit me up!' }); })
        .catch(() => this.setState({ lkBusy: false, lkErr: 'Something went wrong. Try again, or hit me up!' }));
    };
    }

    return vals;
  }
}
