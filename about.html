<section aria-labelledby="about-title" style="padding: 48px 0 96px; display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); gap: 56px; align-items: center">

<p style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #5A5A5A">About</p>
<h1 id="about-title" style="margin: 0; font-family: 'Archivo', sans-serif; font-weight: 600; font-size: clamp(32px, 4vw, 52px); line-height: 1.05; letter-spacing: -0.03em">Hi, I’m Tai.</h1>
<p style="margin: -8px 0 0; max-width: 620px; font-family: 'Archivo', sans-serif; font-size: 24px; font-weight: 500; line-height: 1.35; letter-spacing: -0.01em">Design Lead at Venturus. I lead design systems, design operations and people, and for more than 15 years I’ve designed for education and engineering.</p>
<div style="display: flex; flex-direction: column; gap: 14px; max-width: 620px"><p style="margin: 0; font-size: 20px; line-height: 1.5">I taught myself design in the suburbs of Rio de Janeiro, and the degrees came later. I went from freelance web design to leading design systems for education and engineering products.</p><p style="margin: 0; font-size: 20px; line-height: 1.5">Along the way, I discovered how much I love helping people grow. I’ve led a team of 3 designers and mentored 5 more across systems: reviewing their work, giving clear and actionable feedback, and training the teams that use the systems we build.</p><p style="margin: 0; font-size: 20px; line-height: 1.5">Outside of work, I love cooking, photography, walks in nature, a good cup of coffee, and discovering new places. And yes, I’m a cat person. My biggest dream is to see as much of the world as I can, one place at a time.</p></div>
<div style="display: flex; flex-direction: column; gap: 12px">
<p style="margin: 0; font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A5A5A">Areas of expertise</p>
<ul aria-label="Areas of expertise" style="margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 8px"><li style="border: 1px solid #D4D4D0; border-radius: 999px; padding: 8px 16px; font-weight: 500">Design Systems</li><li style="border: 1px solid #D4D4D0; border-radius: 999px; padding: 8px 16px; font-weight: 500">DesignOps</li><li style="border: 1px solid #D4D4D0; border-radius: 999px; padding: 8px 16px; font-weight: 500">Design Leadership</li><li style="border: 1px solid #D4D4D0; border-radius: 999px; padding: 8px 16px; font-weight: 500">UI &amp; Visual Design</li><li style="border: 1px solid #D4D4D0; border-radius: 999px; padding: 8px 16px; font-weight: 500">AI-assisted Prototyping</li></ul>
</div>
<p style="margin: 0; color: #5A5A5A">Languages: Portuguese (native) · English (C2)</p>
